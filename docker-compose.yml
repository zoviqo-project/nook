services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nook}
      POSTGRES_USER: ${POSTGRES_USER:-nook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nook}
    ports: ["5432:5432"]
    volumes: ["nook-postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nook} -d ${POSTGRES_DB:-nook}"], interval: 5s, timeout: 4s, retries: 20}
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nook}
      DB_USER: ${POSTGRES_USER:-nook}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nook}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-123}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:?GOOGLE_PLACES_API_KEY is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports: ["8080:8080"]
    volumes: ["nook-photos:/app/data/photos"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"], interval: 10s, timeout: 5s, retries: 12}
volumes: {nook-postgres: {}, nook-photos: {}}
