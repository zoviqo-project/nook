services:
  - type: web
    name: nook-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase: {name: nook-postgres, property: host}
      - key: DB_PORT
        fromDatabase: {name: nook-postgres, property: port}
      - key: DB_NAME
        fromDatabase: {name: nook-postgres, property: database}
      - key: DB_USER
        fromDatabase: {name: nook-postgres, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: nook-postgres, property: password}
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: nook-postgres
    plan: free
    databaseName: nook
    user: nook
