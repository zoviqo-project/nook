springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
management.endpoint.health.show-details: never
server:
  forward-headers-strategy: framework
  shutdown: graceful
logging.level:
  root: INFO
  com.nook: INFO
