spring:
  application.name: nook
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nook}}
    username: ${DB_USER:nook}
    password: ${DB_PASSWORD:nook}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 8MB
    max-request-size: 9MB
server.port: ${PORT:8080}
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true
nook:
  demo-profiles-enabled: ${NOOK_DEMO_PROFILES_ENABLED:true}
  jwt-secret: ${JWT_SECRET:change-me-development-secret-at-least-32-bytes}
  access-minutes: ${JWT_ACCESS_MINUTES:30}
  refresh-days: ${JWT_REFRESH_DAYS:30}
  photo-storage: ${PHOTO_STORAGE:./data/photos}
  object-storage:
    bucket: ${OBJECT_STORAGE_BUCKET:}
    region: ${OBJECT_STORAGE_REGION:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    public-base-url: ${OBJECT_STORAGE_PUBLIC_BASE_URL:}
  google-places-api-key: ${GOOGLE_PLACES_API_KEY:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    apple-client-id: ${APPLE_CLIENT_ID:}
    # OAuth client IDs are public identifiers (not secrets). Keep Nook's iOS client as
    # a deploy-safe default; environments can still override it explicitly.
    google-client-id: ${GOOGLE_CLIENT_ID:87732666990-c9joo52gb7qgu5bft6kfbkgmubuoumfi.apps.googleusercontent.com}
    facebook-app-id: ${FACEBOOK_APP_ID:}
    facebook-app-secret: ${FACEBOOK_APP_SECRET:}
  apns:
    enabled: ${APNS_ENABLED:false}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    topic: ${APNS_TOPIC:com.albertesteveferres.nook}
    private-key-path: ${APNS_PRIVATE_KEY_PATH:}
    sandbox: ${APNS_SANDBOX:false}
springdoc.swagger-ui.path: /swagger-ui.html
